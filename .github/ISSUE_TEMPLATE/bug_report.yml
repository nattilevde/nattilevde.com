name: Bug report
description: Something is broken, wrong, or behaves unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Where in the world were you, and what were you doing? If it is in the 3D
        world, the region name in the top-left corner is enough to place it.
      placeholder: |
        1. Enter the 3D world
        2. Ride the bus to the Elavara Hill Stand
        3. Walk east towards the falls
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 134 on Windows 11 / Safari on iPhone 14
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser console. Optional.
      render: text
